<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地视频字幕工作台</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5eaf2;--blue:#2563eb;--blue-soft:#eaf1ff;--green:#14804a;--red:#c53030;--orange:#b7791f;--shadow:0 10px 30px #17203312}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{max-width:980px;margin:auto;padding:28px 18px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.hero h1{margin:0;font-size:28px;letter-spacing:-.5px}.hero p{margin:6px 0 0;color:var(--muted)}
    .pill{background:var(--blue-soft);color:var(--blue);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
    .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.card-head h2{font-size:16px;margin:0}.hint{color:var(--muted);font-size:12px}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0}.row label{width:78px;color:var(--muted);font-weight:600;flex:none}.row input,.row select{min-width:0;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--text);outline:none}.row input:focus,.row select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb1c}.path-actions{display:flex;gap:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:5px}.field select,.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}.checks{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;color:#4a5568}.checks label{display:flex;align-items:center;gap:6px}.checks input{accent-color:var(--blue)}
    button{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;transition:.15s}.btn{background:var(--blue);color:#fff}.btn:hover{filter:brightness(.92);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.secondary{background:#eef2f7;color:#475569}.btn.danger{background:#dc4848;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:150px}
    .queue{list-style:none;padding:0;margin:0}.queue li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}.queue li:last-child{border-bottom:0}.q-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q-index{color:#a0aec0;font-size:12px}.remove{padding:2px 7px;background:transparent;color:#a0aec0}.remove:hover{color:var(--red);background:#fff5f5}.badge{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}.pending{background:#edf2f7;color:#718096}.running{background:#eaf1ff;color:#2563eb}.completed{background:#e8f7ef;color:var(--green)}.failed{background:#fff0f0;color:var(--red)}.stopped{background:#fff8e5;color:var(--orange)}.empty{text-align:center;color:var(--muted);padding:22px!important;display:block!important}
    .progress-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.progress-file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue)}.bar{height:10px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:width .3s}.log{height:250px;overflow:auto;background:#111827;color:#d1d5db;border-radius:10px;padding:14px;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.log .error{color:#fca5a5}.log .warn{color:#fcd34d}.log .info{color:#93c5fd}.toast{display:none;padding:10px 12px;border-radius:9px;margin:10px 0;background:#fff0f0;color:var(--red)}.toast.show{display:block}.modal{display:none;position:fixed;inset:0;background:#0f172a66;place-items:center;padding:18px}.modal.open{display:grid}.modal-box{background:#fff;border-radius:14px;width:min(620px,100%);max-height:80vh;display:flex;flex-direction:column}.modal-head,.modal-foot{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.modal-body{overflow:auto;padding:8px 18px}.subdir{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.subdir span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:700px){.shell{padding:18px 12px 36px}.hero{display:block}.pill{display:inline-block;margin-top:12px}.grid{grid-template-columns:1fr 1fr}.row{display:block}.row label{display:block;width:auto;margin-bottom:5px}.path-actions{margin-top:7px}.path-actions button{flex:1}.card{padding:16px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.actions button{min-width:100%}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero"><div><h1>🎬 本地视频字幕工作台</h1><p>本地模型转写、关键帧提取与 Markdown/字幕导出</p></div><span class="pill">默认：SenseVoiceSmall</span></header>
  <div id="toast" class="toast"></div>
  <section class="card"><div class="card-head"><h2>输入与输出</h2><span class="hint">路径在本机执行，不上传视频</span></div>
    <div class="row"><label for="inputPath">输入路径</label><input id="inputPath" placeholder="视频文件或文件夹路径" spellcheck="false"><div class="path-actions"><button class="btn secondary" onclick="pickFile()">选文件</button><button class="btn secondary" onclick="pickFolder()">选文件夹</button><button class="btn secondary" onclick="openBatch()">批量</button></div></div>
    <div class="row"><label for="outputPath">输出目录</label><input id="outputPath" placeholder="留空则使用输入路径" spellcheck="false"><button class="btn secondary" onclick="pickOutput()">选择</button></div>
    <input id="filePicker" type="file" hidden accept="video/*,audio/*" onchange="filePicked(event)"><input id="folderPicker" type="file" hidden webkitdirectory onchange="folderPicked(event)">
  </section>
  <section class="card"><div class="card-head"><h2>转写设置</h2><button class="btn secondary" onclick="toggleSettings()">收起/展开</button></div><div id="settings">
    <div class="grid"><div class="field"><label>识别模型</label><select id="asrModel"><option value="sensevoice|iic/SenseVoiceSmall" selected>SenseVoiceSmall（中文推荐）</option><option value="faster-whisper|faster-whisper-small">Faster Whisper Small（兼容）</option></select></div><div class="field"><label>设备</label><select id="device"><option value="cuda" selected>CUDA GPU</option><option value="cpu">CPU</option></select></div><div class="field"><label>语言</label><select id="language"><option value="zh" selected>中文</option><option value="en">English</option><option value="">自动识别</option></select></div><div class="field"><label>截图频率</label><select id="keyframeFrequency"><option value="few">少量</option><option value="normal" selected>正常</option><option value="medium">中等</option><option value="many">较多</option><option value="all">全部</option></select></div></div>
    <div class="checks"><label><input type="checkbox" id="fmtMd" checked> Markdown</label><label><input type="checkbox" id="fmtJson"> JSON</label><label><input type="checkbox" id="fmtSrt"> SRT</label><label><input type="checkbox" id="fmtDocx"> Word</label><label><input type="checkbox" id="skipProcessed" checked> 跳过已处理</label><label><input type="checkbox" id="saveKeyframes" checked> 提取关键帧</label><label><input type="checkbox" id="vadFilter"> VAD 静音过滤</label><label><input type="checkbox" id="trashSource"> 完成后移入回收站</label></div>
  </div></section>
  <section class="card actions"><button class="btn" id="enqueueBtn" onclick="enqueueTask()">＋加入队列</button><button class="btn" id="startBtn" onclick="startQueue()">▶开始队列</button><button class="btn danger" id="stopBtn" onclick="stopQueue()" disabled>■停止</button></section>
  <section class="card"><div class="card-head"><h2>任务队列</h2><span class="hint" id="queueSummary">0 项</span></div><ul class="queue" id="queueList"><li class="empty">队列为空，添加任务后开始处理</li></ul></section>
  <section class="card"><div class="card-head"><h2>处理进度</h2><span id="statusBadge" class="badge pending">就绪</span></div><div class="progress-meta"><span id="progressFile" class="progress-file">暂无任务</span><span id="progressPct">0%</span></div><div class="bar"><span id="progressFill"></span></div><div class="progress-meta"><span id="progressDetail">就绪</span><span id="progressCount">0 / 0</span></div></section>
  <section class="card"><div class="card-head"><h2>运行日志</h2><button class="btn secondary" onclick="clearLogs()">清空</button></div><div id="logBox" class="log">准备就绪，可以加入本地任务。</div></section>
</main>
<div id="batchModal" class="modal"><div class="modal-box"><div class="modal-head"><strong>选择要批量处理的子文件夹</strong><button class="remove" onclick="closeBatch()">✕</button></div><div id="batchBody" class="modal-body"></div><div class="modal-foot"><button class="btn secondary" onclick="closeBatch()">取消</button><button class="btn" id="batchConfirm" onclick="confirmBatch()" disabled>加入队列</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let batchDir='',batchItems=[];
function showError(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),5000)}
function pickFile(){$('filePicker').click()}function pickFolder(){ $('folderPicker').dataset.target='input';$('folderPicker').click() }function pickOutput(){ $('folderPicker').dataset.target='output';$('folderPicker').click() }
function filePicked(e){if(e.target.files[0])$('inputPath').value=e.target.files[0].path||e.target.files[0].name;e.target.value=''}
function folderPicked(e){const f=e.target.files[0];if(f){const p=(f.path||f.name).replace(/[\\/][^\\/]*$/,'');if(e.target.dataset.target==='output')$('outputPath').value=p;else{$('inputPath').value=p;if(!$('outputPath').value)$('outputPath').value=p}}e.target.value=''}
function toggleSettings(){const s=$('settings');s.hidden=!s.hidden}
function config(){const m=$('asrModel').value.split('|');return{input:$('inputPath').value.trim(),output:$('outputPath').value.trim(),backend:m[0],model:m[1],device:$('device').value,language:$('language').value||null,keyframe_frequency:$('keyframeFrequency').value,save_keyframes:$('saveKeyframes').checked,skip_processed:$('skipProcessed').checked,fmt_md:$('fmtMd').checked,fmt_json:$('fmtJson').checked,fmt_srt:$('fmtSrt').checked,fmt_docx:$('fmtDocx').checked,vad_filter:$('vadFilter').checked,trash_source:$('trashSource').checked}}
function log(text){if(!text||!text.trim())return;const d=document.createElement('div');d.textContent=text.trim();d.className=/ERROR|失败/.test(text)?'error':/WARNING|警告/.test(text)?'warn':'info';$('logBox').appendChild(d);$('logBox').scrollTop=$('logBox').scrollHeight}
function badge(status){return '<span class="badge '+(status||'pending')+'">'+({pending:'等待中',running:'运行中',completed:'已完成',failed:'失败',stopped:'已停止'}[status]||status)+'</span>'}
function updateQueue(q){$('queueSummary').textContent=(q.completed||0)+' / '+(q.total||0)+' 项';if(!q.items||!q.items.length){$('queueList').innerHTML='<li class="empty">队列为空，添加任务后开始处理</li>';return} $('queueList').innerHTML=q.items.map(i=>'<li><span class="q-index">#'+i.id+'</span><span class="q-name" title="'+esc(i.input)+'">'+esc(i.name)+'</span>'+badge(i.status)+(i.status!=='running'?'<button class="remove" onclick="removeItem('+i.id+')">✕</button>':'<span style="width:31px"></span>')+'</li>').join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateProgress(p){const status=p.status||'idle',pct=p.percentage||0;$('progressFile').textContent=p.current_file||'暂无任务';$('progressPct').textContent=pct+'%';$('progressFill').style.width=pct+'%';$('progressCount').textContent=(p.queue_completed||p.completed||0)+' / '+(p.queue_total||p.total||0);$('progressDetail').textContent={running:'正在处理…',completed:'全部完成',failed:'处理失败',stopped:'已手动停止',idle:'就绪'}[status]||status;$('statusBadge').className='badge '+(status==='idle'?'pending':status);$('statusBadge').textContent={running:'运行中',completed:'已完成',failed:'失败',stopped:'已停止',idle:'就绪'}[status]||status;$('startBtn').disabled=!!p.processing;$('stopBtn').disabled=!p.processing}
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'请求失败');return d}
async function enqueueTask(){const c=config();if(!c.input){showError('请先选择输入路径');return}try{await api('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});$('inputPath').value='';$('outputPath').value='';fetchQueue()}catch(e){showError('加入队列失败：'+e.message)}}
async function startQueue(){try{await api('/api/queue/start',{method:'POST'});$('logBox').textContent='';fetchQueue()}catch(e){showError('启动失败：'+e.message)}}
async function stopQueue(){if(!confirm('确定停止当前任务吗？'))return;await fetch('/api/stop',{method:'POST'})}
async function removeItem(id){try{await api('/api/queue/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});fetchQueue()}catch(e){showError(e.message)}}
async function fetchQueue(){try{updateQueue(await api('/api/queue'))}catch(e){}}
async function fetchLogs(){try{const d=await api('/api/logs');(d.logs||[]).forEach(log);updateProgress(d)}catch(e){}}
function clearLogs(){$('logBox').textContent=''}
async function openBatch(){batchDir=$('inputPath').value.trim();if(!batchDir){showError('请先输入父目录路径');return}$('batchModal').classList.add('open');$('batchBody').textContent='正在扫描…';try{const d=await api('/api/scan-subdirs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:batchDir})});batchItems=d.dirs||[];$('batchBody').innerHTML=batchItems.length?batchItems.map((x,i)=>'<label class="subdir"><input type="checkbox" data-index="'+i+'" checked><span>'+esc(x.name)+'</span></label>').join(''):'没有找到子文件夹';$('batchConfirm').disabled=!batchItems.length}catch(e){$('batchBody').textContent=e.message;$('batchConfirm').disabled=true}}
function closeBatch(){$('batchModal').classList.remove('open')}
async function confirmBatch(){const items=[...document.querySelectorAll('#batchBody input:checked')].map(x=>{const c=config();c.input=batchItems[+x.dataset.index].path;c.output=c.input.replace(/[\\/]+$/,'')+'\\output';return c});try{await api('/api/batch-enqueue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});closeBatch();fetchQueue()}catch(e){showError(e.message)}}
fetchQueue();fetchLogs();setInterval(fetchQueue,3000);setInterval(fetchLogs,2000);
</script>
</body></html>
